<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProKuiZ</title>
<style>
:root{--bg:#1b1464;--ink:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;padding:clamp(16px,4vw,48px)}
h1{margin:0 0 4px;font-size:clamp(2rem,6vw,3.5rem);letter-spacing:.5px}
p.sub{margin:0 0 28px;opacity:.8;font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;max-width:1100px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:18px;min-height:220px;color:#14103a}
.card h2{margin:0;font-size:clamp(1.6rem,4vw,2.4rem)}
.card .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:auto}
.btn{font:inherit;font-weight:700;font-size:1.1rem;text-decoration:none;padding:14px 22px;border-radius:14px;border:3px solid #14103a;color:#14103a}
.btn.main{background:#14103a;color:#fff}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible{outline:5px solid #fff;outline-offset:3px;transform:scale(1.06)}
.bijak{background:#ff5fa8}.intelek{background:#2ed3c4}.intelekpro{background:#ffbf2f}.iqra{background:#5eb4ff}
@media(prefers-reduced-motion:reduce){.btn:hover,.btn:focus-visible{transform:none}}
</style>
</head>
<body>
<h1>ProKuiZ</h1>
<p class="sub">Pilih kuiz anda.</p>

<main class="grid">
  <!-- Ubah pautan di sini sahaja -->
  <section class="card bijak">
    <h2>Bijak</h2>
    <div class="btns">
      <a class="btn main" href="./bijak/">Tekan Untuk Meneroka dan Belajar</a>
    </div>
  </section>

  <section class="card intelek">
    <h2>Intelek</h2>
    <div class="btns">
      <a class="btn main" href="./intelek/">Tekan Untuk Meneroka dan Belajar</a>
    </div>
  </section>

  <section class="card intelekpro">
    <h2>Intelek Pro</h2>
    <div class="btns">
      <a class="btn main" href="./intelekpro/">Tekan Untuk Meneroka dan Belajar</a>
    </div>
  </section>

  <section class="card iqra">
    <h2>Iqra Junior</h2>
    <div class="btns">
      <a class="btn main" href="./iqra-junior/">Tekan Untuk Meneroka dan Belajar</a>
    </div>
  </section>
</main>
</body>
</html>

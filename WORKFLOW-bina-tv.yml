name: Bina ProKuiz TV (4 app)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: bijak
            fail: ProKuiz-Bijak-TV
          - app: intelek
            fail: ProKuiz-Intelek-TV
          - app: intelekpro
            fail: ProKuiz-IntelekPro-TV
          - app: iqra-junior
            fail: ProKuiz-Iqra-Junior-TV
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Semak kunci tandatangan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_BASE64 dan KEYSTORE_PASSWORD belum dimasukkan. Lihat BACA-SAYA.txt (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Pasang lapisan TV (kawalan jauh, tanpa aktiviti menulis)
        run: node ../../scripts/tv-patch.js

      - name: Pasang Capacitor
        run: npm install --legacy-peer-deps

      - name: Simpan fon dalam app
        run: node ../../scripts/fonts-offline.js

      - name: Sediakan projek Android TV
        run: |
          npx cap add android
          node ../../scripts/android-patch.js
          npx cap sync android

      - name: Jana ikon app
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor "#FFF3C9" --splashBackgroundColor "#FFF3C9"

      - name: Pasang kunci tandatangan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/prokuiz-upload.jks

      - name: Bina AAB (Play Store) dan APK (pasang terus)
        working-directory: apps/${{ matrix.app }}/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Kumpul fail
        run: |
          mkdir -p hasil
          cp android/app/build/outputs/bundle/release/*.aab hasil/${{ matrix.fail }}.aab
          cp android/app/build/outputs/apk/release/*.apk hasil/${{ matrix.fail }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.fail }}
          path: apps/${{ matrix.app }}/hasil/
